<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tienda Altiplano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: quiet gallery look (white, plum accent, thin Jost type, big photos, hairlines) applied to the sales system. Left sidebar with vertical menu; dashboard with accent title bars. */
:root{
  --bg:#fbfbfc; --card:#fbfbfc; --ink:#1b1b1f; --muted:#6c6c75; --line:#e2e2e7;
  --sb:#fbfbfc; --sb-ink:#1b1b1f; --sb-mut:#6c6c75; --sb-line:#e2e2e7;
  --acc:#7a2f57; --on-acc:#ffffff; --acc-soft:#f1e7ee; --acc-ink:#5e2244;
  --green:#1f7a4d; --red:#b3261e; --red-soft:#f9e3e1; --blue-soft:#f0f0f3; --field:#ffffff;
  --c1:#7a2f57; --c2:#e0a030; --c3:#2f8f83; --c4:#4a6fa5; --c5:#9a9aa5; --c6:#c4572e;
  --sans:"Inter",system-ui,sans-serif; --display:"Jost",system-ui,sans-serif; --mono:"Jost",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416; --card:#141416; --ink:#ececf0; --muted:#9b9ba5; --line:#2d2d33;
  --sb:#141416; --sb-ink:#ececf0; --sb-mut:#9b9ba5; --sb-line:#2d2d33;
  --acc:#d98fbb; --on-acc:#1d0f17; --acc-soft:#2c2029; --acc-ink:#f0c9de;
  --green:#5fcf9e; --red:#ff8a80; --red-soft:#3a1d1b; --blue-soft:#222226; --field:#1b1b1f;
  --c1:#d98fbb; --c2:#f0b84a; --c3:#4fc3b5; --c4:#7da2d8; --c5:#7d7d88; --c6:#e27d57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --card:#141416; --ink:#ececf0; --muted:#9b9ba5; --line:#2d2d33;
  --sb:#141416; --sb-ink:#ececf0; --sb-mut:#9b9ba5; --sb-line:#2d2d33;
  --acc:#d98fbb; --on-acc:#1d0f17; --acc-soft:#2c2029; --acc-ink:#f0c9de;
  --green:#5fcf9e; --red:#ff8a80; --red-soft:#3a1d1b; --blue-soft:#222226; --field:#1b1b1f;
  --c1:#d98fbb; --c2:#f0b84a; --c3:#4fc3b5; --c4:#7da2d8; --c5:#7d7d88; --c6:#e27d57; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;max-width:100%;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400}
a{color:inherit}
/* botones */
.btn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 18px;font-weight:500;font-size:13px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.acc:hover{filter:brightness(1.08);color:var(--on-acc)}
.btn.sm{padding:4px 12px;font-size:12px}
.btn.big{width:100%;padding:13px;font-size:15px;text-align:center}
.btn.red{color:var(--red)}
.btn.wa{background:#25d366;border-color:#25d366;color:#052e14;text-align:center}
.btn.wa:hover{color:#052e14;filter:brightness(1.05)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.card.flat{border:0;padding:0;background:none}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch h2{font-size:20px}
.amt{font-family:var(--display);font-weight:500;color:var(--acc);font-size:22px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:var(--acc-soft);color:var(--acc-ink);border-radius:99px;padding:0 9px;font-size:12px;font-weight:500;vertical-align:middle;margin-left:6px;font-family:var(--sans)}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--acc-soft);color:var(--acc-ink)}
/* entrada */
.login{min-height:100vh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.lbox{width:min(400px,100%);border:1px solid var(--line);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:16px}
.wm{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:.14em;text-transform:uppercase;line-height:1.1;text-decoration:none}
.wm small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:8px;font-weight:400}
.logo{width:26px;height:26px;border-radius:7px;background:var(--acc);color:var(--on-acc);display:inline-grid;place-items:center;font-weight:600;font-size:13px}
.users{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:transparent;border-radius:6px;padding:10px 12px;text-align:left}
.urow[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.urow small{color:var(--muted)}
.err{color:var(--red);font-size:13px;min-height:1.2em;margin:0}
/* sistema */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sb{background:var(--sb);color:var(--sb-ink);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh;padding:max(32px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.nav button{background:none;border:0;color:var(--muted);text-align:left;padding:5px 0;display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--display);font-weight:300;font-size:20px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:500}
.nav button[aria-current="page"] span:first-child::before{content:"";display:inline-block;width:18px;height:1px;background:var(--acc);vertical-align:middle;margin-right:10px}
.badge{background:var(--acc);color:var(--on-acc);border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-family:var(--sans);font-size:11px;font-weight:600;display:grid;place-items:center}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.who b{display:block;font-weight:500}.who small{color:var(--muted)}
.sbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px;font-size:12.5px}
.sbtn:hover{border-color:var(--acc);color:var(--acc)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:max(28px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-right,0px)) 16px 48px}
.top h1{font-size:34px;font-weight:300;letter-spacing:-.01em;flex:1}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1}
.clock{text-align:right}.clock b{display:block;font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}.clock small{color:var(--muted);font-size:12px}
.net{display:inline-block;background:var(--red-soft);color:var(--red);font-size:11px;border-radius:99px;padding:1px 8px;margin-left:8px}
.content{padding:24px max(40px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) 48px;display:flex;flex-direction:column;gap:20px}
.alertb{background:var(--acc-soft);border-radius:8px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--acc-ink);font-size:13px}
.alertb b{color:var(--ink);font-weight:600}
/* venta */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.pills{display:flex;flex-wrap:wrap;gap:4px 20px;margin:16px 0 20px;border-bottom:1px solid var(--line)}
.pl{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 0;margin-bottom:-1px;font-family:var(--display);font-size:18px;font-weight:300;color:var(--muted)}
.pl:hover{color:var(--ink)}
.pl[aria-pressed="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--acc)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:30px 22px}
.pc{display:grid;grid-template-columns:1fr auto;align-content:start;column-gap:12px;row-gap:2px;text-align:left;padding:0;border:0;background:none;min-width:0}
.pc:disabled{opacity:.5;cursor:not-allowed}
.th{grid-column:1/-1;aspect-ratio:4/5;overflow:hidden;position:relative;display:grid;place-items:center;margin-bottom:8px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transition:transform .5s}
.pc:hover:not(:disabled) .th img{transform:scale(1.04)}
.th span{font-size:11px;color:var(--muted)}
.pc b{grid-column:1;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.25}
.pc .pr{grid-column:2;grid-row:2;font-family:var(--display);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc small{grid-column:1;grid-row:3;color:var(--muted);font-size:12.5px}
.pc .qd{grid-column:2;grid-row:3;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pc .qd.low{color:var(--red);font-weight:600}
.pc .of{grid-column:1/-1;grid-row:4;justify-self:start;margin-top:6px;font-size:12px;background:var(--acc-soft);color:var(--acc-ink);border-radius:99px;padding:1px 10px}
.pc:focus-visible{outline-offset:6px}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cline b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.2}.cline small{display:block;color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{background:none;border:1px solid var(--line);width:26px;height:26px;border-radius:50%;line-height:1}
.stepper button:hover{border-color:var(--acc)}
.stepper span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:13px}
.trow{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 8px}
.trow b{font-family:var(--display);font-weight:400;font-size:22px}
.csum{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-top:8px}
.csum div{display:flex;justify-content:space-between}
details.more{margin:4px 0 10px;font-size:13px}
details.more summary{cursor:pointer;color:var(--muted)}
details.more .two{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:8px}
details.more label{margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:99px;padding:3px;margin:8px 0}
.seg button{background:none;border:0;border-radius:99px;padding:7px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.chg{font-weight:500;margin:8px 0 10px;min-height:1.4em;font-family:var(--display);font-size:16px}
.chg.ok{color:var(--green)}.chg.bad{color:var(--red)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .mono{font-weight:500}
.srow small{color:var(--muted);display:block}
.srow.void{opacity:.55;text-decoration:line-through}
.srow .right{display:flex;align-items:center;gap:12px}
/* inventario y tablas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--bg);padding:16px 18px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stat b.bad{color:var(--red)}
.addf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:180px}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.pname{display:flex;align-items:center;gap:12px}
.pname .th{width:44px;aspect-ratio:1;margin:0;flex:none;grid-column:auto}
/* caja */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--bg);padding:16px 18px}
.kpi small{color:var(--muted);display:block;font-size:12.5px}
.kpi b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.two2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv.sub{padding-left:14px;color:var(--muted)}
.kv b.green{color:var(--green)}
/* dashboard */
.dash{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:start}
.dfil{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
.dfil h4{margin:0 0 6px;background:var(--acc);color:var(--on-acc);font-size:12px;font-weight:600;padding:4px 8px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.fch{border:0;background:var(--acc-soft);color:var(--acc-ink);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center}
.fch[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);font-weight:600}
.dmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.dkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dk{border:1px solid var(--line);text-align:center;min-width:0}
.dk small{display:block;background:var(--acc);color:var(--on-acc);font-weight:600;font-size:11.5px;padding:4px 6px}
.dk b{display:block;padding:10px 6px;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dk b.up{color:var(--green)}.dk b.down{color:var(--red)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.dc{border:1px solid var(--line);min-width:0}
.dh{background:var(--acc);color:var(--on-acc);text-align:center;font-weight:600;font-size:13px;padding:5px 8px}
.db{padding:10px}
.db svg{width:100%;height:auto;display:block}
.tx{fill:var(--ink);font:9px var(--sans)}
.tx.tm{fill:var(--muted)}
.dn{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
.dn ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.dn li{display:flex;align-items:center;gap:8px}
.dn i{width:10px;height:10px;border-radius:2px;flex:none}
.dn li span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
/* modal, aviso, recibo */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,14,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.mbox.wide{width:min(520px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:22px;font-weight:300}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;z-index:70;max-width:90vw;text-align:center}
.rc{background:#fff;color:#111;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11.5px;padding:16px;border-radius:6px;border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.rc .logo{width:24px;height:24px;margin-right:6px;vertical-align:middle;background:#7a2f57;color:#fff}
.rc hr{border:0;border-top:1px dashed #888;margin:4px 0;width:100%}
.rc .c{text-align:center}.rc .l{display:flex;justify-content:space-between;gap:8px}
.rc .big{font-size:22px;text-align:center;font-weight:700;margin:4px 0}
.rc svg{width:100%;height:46px}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shift{display:flex;flex-direction:column;gap:20px}
.users2 .addf{margin-top:12px}
.seg{grid-template-columns:repeat(3,1fr)}.seg button{font-size:12.5px}
.chat{display:flex;flex-direction:column;gap:14px;max-width:900px}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:58vh;overflow:auto;padding:2px}
.m{max-width:92%;padding:12px 16px;border-radius:14px;line-height:1.55}
.m p{margin:0 0 6px}.m p:last-child{margin:0}
.m.u{align-self:flex-end;background:var(--acc);color:var(--on-acc);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--acc-soft);color:var(--ink);border-bottom-left-radius:4px;width:min(100%,640px)}
.m.pend{opacity:.7;font-style:italic}
.m ul{margin:6px 0 0;padding-left:18px}.m li{margin:2px 0}
.mchart{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mct{font-weight:600;font-size:12.5px;margin-bottom:4px}
.mchart svg{width:100%;height:auto;display:block}
.mimg img{max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px}
.sugs2{display:flex;flex-wrap:wrap;gap:8px}
.chatf{display:flex;gap:8px;flex-wrap:wrap}.chatf input[type=text]{flex:1;min-width:200px}
.apre{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.apre img{width:44px;height:44px;object-fit:cover;border-radius:6px}.apre span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
.chatopts{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:end}
@media (max-width:700px){.chatopts{grid-template-columns:1fr}}
.th.nof{aspect-ratio:5/3}.pname .th.nof,.line .th.nof{aspect-ratio:1}
@media (max-width:1000px){.pos{grid-template-columns:1fr}.dash{grid-template-columns:1fr}.dfil{position:static;flex-direction:row;flex-wrap:wrap}.dfil>div{flex:1;min-width:150px}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sb.open{transform:none}
  .burger{display:block}
  .top{padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .top h1{font-size:26px}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
}
@media (max-width:460px){.dn{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}}
@media print{
  body.pr-receipt>*:not(.ov){display:none!important}
  body.pr-receipt .ov{position:static;background:none;padding:0;display:block}
  body.pr-receipt .mbox{border:0;width:80mm;padding:0}
  body.pr-receipt .mbox>*:not(#rc){display:none!important}
  body.pr-list .sb,body.pr-list .top,body.pr-list .tools,body.pr-list .alertb,body.pr-list .btn{display:none!important}
  body.pr-list .app{display:block}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){.sb,.th img{transition:none}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="lbox">
    <div class="wm">Altiplano<small>Golosinas y snacks</small></div>
    <p class="hint" style="margin:0">Elige tu usuario y escribe tu PIN.</p>
    <div class="users" id="ulist"></div>
    <label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••"></label>
    <p class="err" id="lerr"></p>
    <button class="btn acc big" id="enter">Entrar</button>
    <p class="hint" id="lhint"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="sb" id="sb">
    <div class="wm">Altiplano<small>Golosinas y snacks</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sbf">
      <div class="who"><b id="uname"></b><small id="urole"></small></div>
      <button class="sbtn" id="theme">Cambiar tema</button>
      <button class="sbtn" id="logout">Cerrar sesión</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Abrir menú">≡</button>
      <h1 id="title">Tienda</h1>
      <div class="clock"><b id="clk">--:--:--</b><small id="dt"></small><span class="net" id="net" hidden>Sin conexión</span></div>
    </header>
    <div class="content">
      <div class="alertb" id="alert" hidden></div>

      <section id="v-tienda" hidden>
        <div class="pos">
          <div class="card flat">
            <input id="q" type="search" placeholder="Buscar producto (café, panela, taza...)" autocomplete="off" aria-label="Buscar producto">
            <div class="pills" id="pills"></div>
            <div class="pgrid" id="pgrid"></div>
          </div>
          <div class="card" id="cart">
            <div class="ch"><h2>Venta actual</h2><button class="btn sm" id="clear">Vaciar</button></div>
            <div id="clines"></div>
            <div class="csum" id="csum"></div>
            <div class="trow"><b>Total</b><span class="amt" id="ctotal">$0</span></div>
            <details class="more"><summary>Descuento y cliente (opcional)</summary>
              <div class="two"><label>Descuento<input id="dv" type="number" min="0" step="1" placeholder="0"></label><label>Tipo<select id="dtp"><option value="pct">%</option><option value="fix">$</option></select></label></div>
              <p class="hint" id="dmsg"></p>
              <label>Cliente<input id="cn" type="text" placeholder="Nombre"></label>
              <label>Teléfono (para enviar el recibo)<input id="ct" type="tel" inputmode="tel" placeholder="3001234567"></label>
            </details>
            <div class="seg" id="seg"><button data-pay="Efectivo" class="on">Efectivo</button><button data-pay="Transferencia">Transferencia</button><button data-pay="Mixto">Mixto</button></div>
            <div id="cashbox"><label>¿Con cuánto paga?<input id="recv" type="number" min="0" inputmode="numeric" placeholder="Ej. 10000"></label><div class="chg" id="chg"></div></div>
            <div id="mixbox" hidden><label>Paga por transferencia<input id="mt" type="number" min="0" inputmode="numeric" placeholder="Ej. 8000"></label><label style="margin-top:8px">Paga en efectivo<input id="mc" type="number" min="0" inputmode="numeric" placeholder="Ej. 7000"></label><div class="chg" id="chg2"></div></div>
            <div id="acctbox" hidden><label>¿A cuál cuenta?<select id="acct"><option>Nequi</option><option>Daviplata</option><option>Bancolombia</option><option>BBVA</option><option>Otro banco</option></select></label><div class="chg"></div></div>
            <button class="btn acc big" id="charge" disabled>Cobrar venta</button>
          </div>
        </div>
        <div class="card" style="margin-top:16px">
          <div class="ch"><h2>Ventas de hoy <span class="pill" id="tcount">0</span></h2><span class="amt" id="ttotal">$0</span></div>
          <div id="tlist"></div>
        </div>
      </section>

      <section id="v-inventario" hidden>
        <div class="stats" id="istats"></div>
        <div class="card" style="margin-top:16px">
          <div class="ch"><h2>Agregar producto</h2></div>
          <form class="addf" id="addf">
            <label>Nombre<input id="a-n" type="text" placeholder="Ej. Café Huila 340 g" required></label>
            <label>Categoría<input id="a-c" type="text" list="cats" placeholder="Café, Cerámica..." required></label>
            <label>Precio venta<input id="a-p" type="number" min="0" step="100" required></label>
            <label>Costo<input id="a-k" type="number" min="0" step="100" required></label>
            <label>Stock inicial<input id="a-s" type="number" min="0" step="1" value="0"></label>
            <label>Avisar con<input id="a-al" type="number" min="0" step="1" value="5"></label>
            <label>Código (opcional)<input id="a-cd" type="text" placeholder="Código de barras"></label>
            <label>Foto (opcional)<input id="a-f" type="file" accept="image/*"></label>
            <button class="btn acc" type="submit">Agregar</button>
          </form>
          <div class="live hint" id="alive"></div>
          <datalist id="cats"></datalist>
        </div>
        <div class="card" style="margin-top:16px">
          <div class="ch"><h2>Inventario</h2><button class="btn sm" id="xls">Descargar Excel</button></div>
          <div class="tools"><input id="iq" type="search" placeholder="Buscar producto..." aria-label="Buscar en inventario"></div>
          <div class="tw" id="itable"></div>
        </div>
      </section>

      <section id="v-caja" hidden><div id="cajac" style="display:flex;flex-direction:column;gap:16px"></div></section>

      <section id="v-historial" hidden>
        <div class="card">
          <div class="tools">
            <input id="hq" type="search" placeholder="Buscar número de venta o producto..." aria-label="Buscar venta">
            <input id="hm" type="month" style="max-width:170px" aria-label="Mes">
            <button class="btn sm" id="hall">Ver todo</button>
          </div>
          <p class="hint" id="hsum"></p>
          <div class="tools" style="margin-top:8px"><button class="btn sm" id="hxls">Exportar a Excel</button><button class="btn sm" id="hpdf">Descargar PDF</button><button class="btn sm" id="hprint">Imprimir</button></div>
          <div id="hlist"></div>
        </div>
      </section>

      <section id="v-dashboard" hidden><div id="dashc"></div></section>

      <section id="v-gastos" hidden>
        <div class="stats" id="xstats"></div>
        <div class="card" style="margin-top:16px">
          <div class="ch"><h2>Registrar gasto</h2></div>
          <form class="addf" id="xf">
            <label>Concepto<input id="x-c" type="text" placeholder="Ej. Arriendo, flete, bolsas" required></label>
            <label>Categoría<select id="x-k"><option>Arriendo</option><option>Servicios</option><option>Transporte</option><option>Nómina</option><option>Mercadeo</option><option>Otros</option></select></label>
            <label>Monto<input id="x-a" type="number" min="0" step="100" required></label>
            <label>Pagado con<select id="x-p"><option>Efectivo</option><option>Transferencia</option></select></label>
            <label>Nota (opcional)<input id="x-n" type="text"></label>
            <button class="btn acc" type="submit">Registrar gasto</button>
          </form>
          <p class="hint" id="x-m"></p>
        </div>
        <div class="card" style="margin-top:16px"><div class="ch"><h2>Gastos</h2><input id="xm" type="month" style="max-width:170px" aria-label="Mes"></div><div class="tw" id="xtable"></div></div>
      </section>

      <section id="v-asistente" hidden>
        <div class="card chat">
          <div class="msgs" id="msgs" aria-live="polite"></div>
          <div class="sugs2" id="sugs"></div>
          <div class="apre" id="apre" hidden><img id="apimg" alt="Imagen adjunta"><span id="apname"></span><button class="btn sm" type="button" id="apx">Quitar</button></div>
          <form class="chatf" id="cf">
            <input id="cq" type="text" placeholder="Escribe tu pregunta, ej.: ¿qué producto me deja más ganancia?" autocomplete="off" aria-label="Pregunta">
            <input id="cimg" type="file" accept="image/*" hidden>
            <button class="btn" type="button" id="cclip">Adjuntar imagen</button>
            <button class="btn acc" type="submit">Preguntar</button>
          </form>
          <div class="chatopts"><label>Modo<select id="amode"><option value="auto">Automático</option><option value="rules">Solo respuestas rápidas</option><option value="ai">Siempre con IA</option></select></label><p class="hint" id="anote"></p></div>
        </div>
      </section>

      <section id="v-turnos" hidden><div class="shift" id="turnosc"></div></section>
      <section id="v-ajustes" hidden><div id="ajustesc" style="display:flex;flex-direction:column;gap:16px"></div></section>
    </div>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>

 if(any(/(inventario|capital|valor del stock|vale la bodega|unidades en bodega|cuanto stock)/)){var u=0,v=0,vp=0;S.items.forEach(function(x){u+=x.stock;v+=x.stock*x.k;vp+=x.stock*x.p});return 'En bodega hay <b>'+u+'</b> unidades. Valen <b>'+cop(v)+'</b> a costo y <b>'+cop(vp)+'</b> a precio de venta (ganancia posible '+cop(vp-v)+').'}
 if(any(/(compar|crec|subio|bajo|mejor que|peor que)/)){var now=new Date(),cm=agg(new Date(now.getFullYear(),now.getMonth(),1).getTime(),0),pm2=agg(new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),new Date(now.getFullYear(),now.getMonth(),1).getTime()),same=agg(new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),new Date(now.getFullYear(),now.getMonth()-1,now.getDate()+1).getTime());return 'Este mes llevas <b>'+cop(cm.t)+'</b>. En el mismo tramo del mes pasado habías vendido <b>'+cop(same.t)+'</b>'+(same.t?' ('+(cm.t>=same.t?'+':'')+Math.round((cm.t-same.t)/same.t*100)+'%)':'')+'. El mes pasado completo fue <b>'+cop(pm2.t)+'</b>.'+mchart("Comparación",svgBar([same.t,cm.t],["Mes pasado (mismo tramo)","Este mes"].map(function(s){return s.length>10?s.slice(0,10):s}),1,fk))}
 var fp=findProd(q);
 if(fp.length&&fp.length<=3)return fp.map(function(x){var r=a.prod[x.n]||{u:0,r:0,c:0};return '<b>'+esc(x.n)+'</b><ul><li>Precio: '+cop(x.p)+' · costo '+cop(x.k)+' · ganancia por unidad '+cop(x.p-x.k)+' ('+pct(x.p-x.k,x.p)+'%)</li><li>En bodega: '+x.stock+' unidades'+(x.stock<=x.al?' (conviene pedir)':'')+'</li><li>Vendido '+p.n+': '+r.u+' unidades por '+cop(r.r)+' (ganancia '+cop(r.r-r.c)+')</li></ul>'}).join("");
 if(any(/(venta|vendi|vendimos|cuanto|total|ingres|facturado|entro|recaud)/)){if(!a.n)return 'No hay ventas '+p.n+'.';var ss=salesSeries(p.from,p.to);return 'Vendiste <b>'+cop(a.t)+'</b> '+p.n+' en <b>'+a.n+'</b> ventas ('+a.u+' unidades, ticket promedio '+cop(a.t/a.n)+').'+mchart("Ventas "+p.n,svgBar(ss.vals,ss.labs,-1,fk))}
 answerMiss=true;return 'No entendí bien esa pregunta. '+help()}

function md(t){var h=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/),out="",inl=false;
 h.forEach(function(l){if(/^\s*[-•]\s+/.test(l)){if(!inl){out+="<ul>";inl=true}out+="<li>"+l.replace(/^\s*[-•]\s+/,"")+"</li>"}else{if(inl){out+="</ul>";inl=false}if(l.trim())out+="<p>"+l+"</p>"}});
 if(inl)out+="</ul>";return out}
function aiChart(c){var money=!!c.money,f=money?fk:function(v){return String(Math.round(v*100)/100)},labs=c.labels.map(function(l){return esc(String(l).slice(0,10))}),items=c.labels.map(function(l,i){return {n:String(l),v:c.values[i]}});
 if(c.type==="bar")return mchart(c.title,svgBar(c.values,labs,-1,f));
 if(c.type==="line")return mchart(c.title,svgLine(c.values,labs,f));
 if(c.type==="donut")return mchart(c.title,svgDonut(items.filter(function(x){return x.v>0})));
 return mchart(c.title,svgH(items,f))}
function plain(h){return String(h).replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/\s+/g," ").trim()}
function drawChat(){var ai=!!S.settings.aiCode;
 if(!CHAT.length)CHAT.push({r:"a",h:'Hola, '+esc(cur.name)+'. Soy el asistente de '+esc(S.settings.store)+'. Pregúntame por ventas, ganancias, gastos, inventario o productos y te respondo con gráficos.'+(ai?' También puedes escribir cualquier otra pregunta o adjuntar una imagen.':' Para preguntas libres y para leer imágenes hay que activar la IA en Ajustes.')});
 $("msgs").innerHTML=CHAT.map(function(m){return '<div class="m '+(m.r==="u"?"u":"a")+(m.pending?" pend":"")+'">'+m.h+'</div>'}).join("");
 $("sugs").innerHTML=["¿Cuánto vendí hoy?","¿Qué producto se vende más este mes?","¿Cuál fue mi ganancia este mes?","¿Qué debo pedir al proveedor?","¿Cuánto gasté este mes?","¿Quién vendió más?","¿A qué hora vendo más?","¿Cuánto hay en caja hoy?","Precio Big Bom"].map(function(s){return '<button class="fch" type="button" data-q="'+esc(s)+'">'+esc(s)+'</button>'}).join("");
 $("anote").textContent=ai?"IA activada. Con la IA se envían tu pregunta, la imagen y un resumen de ventas, gastos e inventario (sin datos de clientes).":"La IA no está activada. Las respuestas rápidas funcionan sin internet y sin costo.";
 $("cclip").hidden=false;$("msgs").scrollTop=$("msgs").scrollHeight}
function ctxData(){var now=new Date(),D=864e5,d0=day0(now),w0=d0-((now.getDay()+6)%7)*D,m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(),i;
 var slim=function(a){return {total:a.t,ventas:a.n,unidades:a.u,costo:a.c,ganancia:a.t-a.c,descuentos:a.disc}},mon=agg(m0,0),a30=agg(Date.now()-30*D,0),months=[];
 for(i=11;i>=0;i--){var f=new Date(now.getFullYear(),now.getMonth()-i,1),t=new Date(now.getFullYear(),now.getMonth()-i+1,1),a=agg(f.getTime(),t.getTime());months.push({mes:f.getFullYear()+"-"+pad(f.getMonth()+1,2),ventas:a.t,costo:a.c,unidades:a.u,numVentas:a.n,gastos:expSum(f.getTime(),t.getTime())})}
 var daily=[];for(i=29;i>=0;i--){var s0=d0-i*D,a2=agg(s0,s0+D);daily.push({dia:pad(new Date(s0).getMonth()+1,2)+"-"+pad(new Date(s0).getDate(),2),total:a2.t})}
 var gc={};(S.expenses||[]).forEach(function(e){if(e.ts>=m0)gc[e.cat]=(gc[e.cat]||0)+e.amt});
 var pm=function(o){var r={};Object.keys(o).forEach(function(k){r[k]={unidades:o[k].u,vendido:o[k].r,costo:o[k].c}});return r};
 return {tienda:S.settings.store,hoy:now.toISOString().slice(0,10),
  productos:S.items.map(function(x){return {nombre:x.n,categoria:x.c,precio:x.p,costo:x.k,stock:x.stock,avisarCon:x.al,oferta:offer(x)}}),
  ventas:{hoy:slim(agg(d0,0)),semana:slim(agg(w0,0)),mes:slim(mon),ultimos30dias:slim(a30)},
  productosVendidosMes:pm(mon.prod),productosVendidos30d:pm(a30.prod),vendidoPorVendedorMes:mon.sell,porMedioDePagoMes:mon.pm,porDiaSemanaMes:mon.wd,porHoraMes:mon.hr,
  porMes:months,ventasDiarias30d:daily,gastosMesPorCategoria:gc,ultimosGastos:(S.expenses||[]).slice(0,10).map(function(e){return {fecha:new Date(e.ts).toISOString().slice(0,10),concepto:e.concept,categoria:e.cat,monto:e.amt}})}}
function aiErr(status,err){
 if(status===401)return "El código de acceso del asistente no es correcto. Revísalo en Ajustes → Asistente con IA.";
 if(status===503)return "La IA todavía no está activada en el servidor: faltan las variables ANTHROPIC_API_KEY y ASSISTANT_CODE en Vercel. En Ajustes → Asistente con IA están los pasos.";
 if(status===429)return "Hay demasiadas preguntas seguidas o se acabó el límite de la cuenta de IA. Espera un minuto e intenta de nuevo.";
 if(status===502&&err==="clave_invalida")return "La clave de la API de Anthropic configurada en Vercel no es válida.";
 if(status===504)return "La IA tardó demasiado en responder. Intenta de nuevo.";
 return "No pude conectar con la IA ahora. Intenta de nuevo en un momento."}
function callAI(q,img){var hist=CHAT.filter(function(m){return !m.pending&&m.t}).slice(-9,-1).map(function(m){return {role:m.r==="u"?"user":"assistant",text:m.t}});
 return fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:S.settings.aiCode,question:q,history:hist,image:img,context:ctxData()})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,j:j}})})}
function pushAnswer(h,t){CHAT=CHAT.filter(function(m){return !m.pending});CHAT.push({r:"a",h:h,t:t});drawChat()}
function ask(t){t=t.trim();var img=AIMG;if(!t&&!img||AIBUSY)return;var ai=!!S.settings.aiCode,mode=$("amode").value;
 CHAT.push({r:"u",h:(t?esc(t):"")+(img?'<div class="mimg"><img alt="Imagen adjunta" src="'+img.url+'"></div>':""),t:t||"(imagen adjunta)"});$("cq").value="";clearImg();
 if(!img&&mode!=="ai"){var h=answer(t);if(!(answerMiss&&mode==="auto"&&ai)){pushAnswer(h,plain(h));return}}
 if(!ai){pushAnswer("Para "+(img?"leer imágenes":"contestar esa pregunta")+" necesito la IA, y todavía no está activada. Actívala en <b>Ajustes → Asistente con IA</b>. Mientras tanto puedo contestarte las preguntas comunes de ventas, gastos e inventario.",""); return}
 AIBUSY=true;CHAT.push({r:"a",h:"Pensando…",pending:true});drawChat();
 callAI(t,img?{mediaType:img.mediaType,data:img.data}:null).then(function(o){
  if(o.status===200&&o.j&&o.j.answer!=null){var ch=(o.j.charts||[]).map(aiChart).join("");pushAnswer(md(o.j.answer)+ch,o.j.answer)}
  else pushAnswer(esc(aiErr(o.status,o.j&&o.j.error)),"")
 }).catch(function(){pushAnswer("La IA solo funciona en la página publicada en Vercel y con internet. Aquí puedo contestar las preguntas comunes sin IA.","")}).then(function(){AIBUSY=false})}
function clearImg(){AIMG=null;$("apre").hidden=true;$("cimg").value=""}
$("cclip").onclick=function(){$("cimg").click()};
$("apx").onclick=clearImg;
$("cimg").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var url=c.toDataURL("image/jpeg",.82);AIMG={url:url,mediaType:"image/jpeg",data:url.split(",")[1]};$("apimg").src=url;$("apname").textContent=f.name;$("apre").hidden=false};im.onerror=function(){toast("No pude leer esa imagen.")};im.src=r.result};r.readAsDataURL(f)};

$("sugs").onclick=function(e){var b=e.target.closest("[data-q]");if(b)ask(b.getAttribute("data-q"))};
function aiCard(){return '<div class="card"><div class="ch"><h2>Asistente con IA</h2></div><p class="hint" style="margin:0 0 12px">Sirve para preguntar cualquier cosa sobre la tienda y para analizar imágenes, por ejemplo la foto de una factura de proveedor. Usa Claude y cada pregunta se cobra a tu cuenta de Anthropic. Se envían a ese servicio tu pregunta, la imagen y un resumen de ventas, gastos e inventario, sin nombres ni teléfonos de clientes.</p><div class="addf"><label>Código de acceso del asistente<input id="ai-c" type="password" autocomplete="off" value="'+esc(S.settings.aiCode||"")+'" placeholder="El mismo que pusiste en Vercel"></label><button class="btn" id="ai-t" type="button">Probar conexión</button></div><p class="hint" id="ai-m"></p><details class="more"><summary>Cómo activarla (una sola vez)</summary><ol style="margin:8px 0 0;padding-left:18px;line-height:1.7"><li>Crea una clave de API en console.anthropic.com y pon saldo en tu cuenta.</li><li>En Vercel abre el proyecto <b>tienda-altiplano</b> → Settings → Environment Variables.</li><li>Agrega <b>ANTHROPIC_API_KEY</b> con tu clave y <b>ASSISTANT_CODE</b> con un código que inventes (es la contraseña del asistente).</li><li>En Deployments toca Redeploy para que tome los cambios.</li><li>Escribe aquí el mismo código y toca Probar conexión.</li></ol></details></div>'}
function testAI(){var c=$("ai-c").value.trim();S.settings.aiCode=c;save();$("ai-m").textContent="Probando…";
 fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c,ping:true})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {status:r.status,j:j}})}).then(function(o){$("ai-m").textContent=o.status===200?"Conexión lista. El asistente usará el modelo "+o.j.model+".":aiErr(o.status,o.j&&o.j.error)}).catch(function(){$("ai-m").textContent="Esta prueba solo funciona en la página publicada en Vercel."})}

function drawAjustes(){
 $("ajustesc").innerHTML='<div class="card"><div class="ch"><h2>Datos de la tienda</h2></div><div class="addf"><label>Nombre de la tienda<input id="g-n" value="'+esc(S.settings.store)+'"></label><label>WhatsApp del negocio (con indicativo)<input id="g-w" inputmode="numeric" value="'+esc(S.settings.wa)+'" placeholder="573001234567"></label><label>Descuento máximo del trabajador (%)<input id="g-d" type="number" min="0" max="100" value="'+S.settings.maxd+'"></label></div><p class="hint" id="g-m"></p></div>'+
 aiCard()+'<div class="card users2"><div class="ch"><h2>Usuarios</h2></div><div class="tw"><table><thead><tr><th>Nombre</th><th>Rol</th><th>PIN</th><th></th></tr></thead><tbody>'+S.users.map(function(u){return '<tr><td>'+esc(u.name)+(u.id===cur.id?' <span class="tag ok">Tú</span>':'')+'</td><td>'+esc(u.role)+'</td><td><input type="text" inputmode="numeric" maxlength="8" value="'+esc(u.pin)+'" data-pin="'+u.id+'" style="width:100px" aria-label="PIN de '+esc(u.name)+'"></td><td class="n">'+(u.id===cur.id?'':'<button class="btn sm red" data-urm="'+u.id+'">Eliminar</button>')+'</td></tr>'}).join("")+'</tbody></table></div>'+
 '<form class="addf" id="uf"><label>Nombre<input id="u-n" required></label><label>Rol<select id="u-r"><option>Trabajador</option><option>Secretaria</option><option>Administrador</option></select></label><label>PIN (4 a 8 números)<input id="u-p" inputmode="numeric" maxlength="8" required></label><button class="btn acc" type="submit">Agregar usuario</button></form><p class="hint" id="u-m"></p></div>'+
 '<div class="card"><div class="ch"><h2>Permisos</h2></div><div class="tw"><table><thead><tr><th>Acción</th><th>Administrador</th><th>Secretaria</th><th>Trabajador</th></tr></thead><tbody>'+[["Vender y cobrar","Sí","Sí","Sí"],["Ver ventas de hoy","Todas","Todas","Solo las suyas"],["Crear, editar o eliminar productos","Sí","Sí","No"],["Registrar entrada de mercancía","Sí","Sí","No"],["Ver caja, ganancia e historial","Sí","Sí","No"],["Anular ventas","Sí","Sí","No"],["Registrar gastos","Sí","Sí","No"],["Usar el asistente","Sí","Sí","No"],["Usuarios y ajustes","Sí","No","No"]].map(function(r){return '<tr><td>'+r[0]+'</td>'+r.slice(1).map(function(c){return '<td style="color:'+(c==="No"?'var(--red)':'var(--green)')+';font-weight:600">'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div><p class="hint">Estos permisos se aplican en esta página. Para que también los exija un servidor hace falta una base de datos con inicio de sesión.</p></div>'+
 '<div class="card"><div class="ch"><h2>Datos</h2></div><p class="hint" style="margin:0 0 10px">Todo se guarda solo en este navegador. Las ventas marcadas como Ejemplo son de muestra y no cuentan como reales.</p><div class="tools"><button class="btn" id="g-hload">Cargar ventas y gastos de ejemplo</button><button class="btn" id="g-hclear">Borrar ventas y gastos de ejemplo</button><button class="btn red" id="g-reset">Restaurar datos de ejemplo</button></div></div>'}
$("ajustesc").onchange=function(e){var t=e.target;
 if(t.id==="ai-c"){S.settings.aiCode=t.value.trim();save();toast("Código guardado.");return}
 if(t.id==="g-n"||t.id==="g-w"||t.id==="g-d"){S.settings.store=$("g-n").value.trim()||"Tienda Altiplano";S.settings.wa=$("g-w").value.replace(/\D/g,"");S.settings.maxd=Math.max(0,Math.min(100,Math.round(nm("g-d"))));save();$("g-m").textContent="Ajustes guardados."}
 var p=t.getAttribute("data-pin");if(p){var u=S.users.filter(function(x){return x.id==p})[0];var v=t.value.replace(/\D/g,"");if(v.length<4){toast("El PIN debe tener al menos 4 números.");t.value=u.pin;return}u.pin=v;save();toast("PIN actualizado.")}};
$("ajustesc").onclick=function(e){if(e.target.id==="ai-t"){testAI();return}var r=e.target.getAttribute("data-urm");

 if(e.target.id==="g-reset"){var b=e.target;if(b.getAttribute("data-sure")){S=seed();save();cart=[];cur=S.users[0];try{localStorage.setItem(SES,String(cur.id))}catch(_){}start()}else{b.setAttribute("data-sure","1");b.textContent="¿Seguro? Toca otra vez"}}};
$("ajustesc").onsubmit=function(e){if(e.target.id!=="uf")return;e.preventDefault();var n=$("u-n").value.trim(),p=$("u-p").value.replace(/\D/g,"");
 if(!n||p.length<4){$("u-m").textContent="Escribe el nombre y un PIN de al menos 4 números.";return}
 S.users.push({id:S.uid++,name:n,role:$("u-r").value,pin:p});save();drawAjustes();$("u-m").textContent="Usuario "+n+" creado."};
/* ---------- arranque ---------- */
applyTheme();
var sid=null;try{sid=Number(localStorage.getItem(SES))}catch(e){}
var su=S.users.filter(function(u){return u.id===sid})[0];
if(su){cur=su;start()}else{drawLogin();$("login").hidden=false}
